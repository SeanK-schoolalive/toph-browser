# Custom Tor Network Configuration Template for Toph Browser
# Use this to configure a private/custom Tor network.
# IMPORTANT: Only use this if you control the Tor authorities and relays.

[tor]
network=custom
authorities=custom
relays=custom
descriptors=custom

[directory]
# Set these to your custom directory authority addresses
# Format: address:port fingerprint
# Example:
# authority1=10.0.0.1:9030 AAAA00000000000000000000000000000000000000
# authority2=10.0.0.2:9030 BBBB00000000000000000000000000000000000000

[bridges]
enabled=false

[proxy]
socks_port=9050
control_port=9051
