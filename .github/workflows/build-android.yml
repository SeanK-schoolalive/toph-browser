name: Build Toph Browser Android

on:
  push:
    branches: [main]
    paths:
      - "VERSION.lock"
      - "patches/**"
      - "config/**"
      - "scripts/**"
      - "build/**"
      - ".github/workflows/build-android.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: toph-android-build
  cancel-in-progress: false

jobs:
  build:
    name: Android
    runs-on: ubuntu-24.04
    timeout-minutes: 1000

    steps:
      - uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses
          sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0"
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"

      - name: Check shell syntax
        shell: bash
        run: |
          set -euo pipefail
          bash -n scripts/*.sh

      - name: Build with patches
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/build-with-patches.sh

      - name: Locate APK/AAB files
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          find . -type f \( -iname "*.apk" -o -iname "*.aab" \) | tee apk-list.txt
          if [ ! -s apk-list.txt ]; then
            echo "No APK/AAB files were produced."
            exit 1
          fi

      - name: Upload APK artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: toph-browser-android-apk
          path: |
            **/*.apk
            **/*.aab
          if-no-files-found: error

      - name: Upload build logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: toph-browser-android-logs
          path: |
            **/*.log
            /tmp/*.log
          if-no-files-found: warn
