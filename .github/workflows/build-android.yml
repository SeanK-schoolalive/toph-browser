name: Build Toph Browser Android

on:
  push:
    branches: [main]
    paths:
      - "VERSION.lock"
      - "patches/**"
      - "config/**"
      - "scripts/**"
      - "build/**"
      - ".github/workflows/build-android.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: toph-android-build
  cancel-in-progress: false

jobs:
  build:
    name: Android
    runs-on: ubuntu-24.04
    timeout-minutes: 1000
    steps:
      - uses: actions/checkout@v4

      - name: Check shell syntax
        shell: bash
        run: |
          set -euo pipefail
          bash -n scripts/*.sh

      - name: List workspace
        run: ls

      - name: Build with patches
        run: ./build-with-patches.sh
