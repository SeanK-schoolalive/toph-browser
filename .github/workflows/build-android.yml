name: Build Toph Browser Android

on:
  push:
    branches: [main]
    paths:
      - "VERSION.lock"
      - "patches/**"
      - "config/**"
      - "scripts/**"
      - "build/**"
      - ".github/workflows/build-android.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: toph-android-build
  cancel-in-progress: false

jobs:
  build:
    name: Android
    runs-on: ubuntu-24.04
    timeout-minutes: 1000

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Java 17
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y openjdk-17-jdk

      - name: Configure Android SDK
        shell: bash
        run: |
          set -euo pipefail

          export ANDROID_SDK_ROOT="${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}"
          export ANDROID_HOME="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          export PATH="$ANDROID_HOME/platform-tools:$PATH"

          if [[ ! -d "$ANDROID_SDK_ROOT" ]]; then
            echo "Android SDK not found at $ANDROID_SDK_ROOT"
            exit 1
          fi

          if [[ -x "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" ]]; then
            SDKMANAGER="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          elif [[ -x "$ANDROID_SDK_ROOT/cmdline-tools/16.0/bin/sdkmanager" ]]; then
            SDKMANAGER="$ANDROID_SDK_ROOT/cmdline-tools/16.0/bin/sdkmanager"
          else
            echo "sdkmanager not found in $ANDROID_SDK_ROOT"
            echo "Installed SDK layout:"
            find "$ANDROID_SDK_ROOT" -maxdepth 3 -type f -name sdkmanager 2>/dev/null || true
            exit 1
          fi

          echo "SDKMANAGER=$SDKMANAGER" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"

      - name: Accept Android SDK licenses and install packages
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="${SDKMANAGER:-$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager}"

          # Accept licenses without failing on the broken pipe case
          printf 'y\n' | "$SDKMANAGER" --licenses >/dev/null || true

          "$SDKMANAGER" \
            "platform-tools" \
            "platforms;android-34" \
            "build-tools;34.0.0"

      - name: Check shell syntax
        shell: bash
        run: |
          set -euo pipefail
          bash -n scripts/*.sh

      - name: Build with patches
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/build-with-patches.sh

      - name: Locate APK/AAB files
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          find . -type f \( -iname "*.apk" -o -iname "*.aab" \) | tee apk-list.txt
          if [ ! -s apk-list.txt ]; then
            echo "No APK/AAB files were produced."
            exit 1
          fi

      - name: Upload APK artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: toph-browser-android-apk
          path: |
            **/*.apk
            **/*.aab
          if-no-files-found: error

      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: toph-browser-android-logs
          path: |
            **/*.log
            /tmp/*.log
          if-no-files-found: warn
